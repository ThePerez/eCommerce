<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLab Store</title>
    <!-- Bootstrap CSS para diseño profesional -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1a1e21; }
        .hero { background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); color: white; padding: 3rem 0; border-radius: 0 0 20px 20px; margin-bottom: 2rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
        .price { font-size: 1.6rem; font-weight: 700; color: #198754; }
        .badge-cat { background-color: #6c757d; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-laptop-code me-2"></i>TechLab Store
            </a>
        </div>
    </nav>

    <!-- Encabezado -->
    <div class="container">
        <div class="hero shadow text-center">
            <h1 class="display-5 fw-bold">Catálogo de Productos</h1>
            <p class="lead mb-0">Consumiendo la API REST en tiempo real</p>
        </div>
    </div>

    <!-- Grilla de productos -->
    <div class="container mb-5">
        <div class="row g-4" id="contenedor-productos">
            <!-- Los productos se inyectan acá desde JavaScript -->
        </div>
    </div>

    <!-- Script para consumir tu API -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/api/productos")
                .then(response => response.json())
                .then(productos => {
                    const contenedor = document.getElementById("contenedor-productos");
                    
                    if(productos.length === 0) {
                        contenedor.innerHTML = `<div class="col-12 text-center text-muted mt-5">
                            <i class="fa-solid fa-box-open fa-3x mb-3"></i>
                            <h4>No hay productos cargados</h4>
                            <p>Usá Thunder Client para hacer un POST y agregar stock.</p>
                        </div>`;
                        return;
                    }

                    productos.forEach(p => {
                        const nombreCategoria = p.categoria ? p.categoria.nombre : 'Sin categoría';
                        const badgeColor = p.stock > 0 ? 'bg-success' : 'bg-danger';
                        
                        const tarjeta = `
                            <div class="col-12 col-md-6 col-lg-4">
                                <div class="card h-100 p-3">
                                    <div class="card-body">
                                        <span class="badge badge-cat mb-2">${nombreCategoria}</span>
                                        <h4 class="card-title text-dark fw-bold">${p.nombre}</h4>
                                        <p class="card-text text-secondary">${p.descripcion || 'Sin descripción detallada.'}</p>
                                        <div class="mt-3">
                                            <span class="price">$${p.precio.toLocaleString('es-AR')}</span>
                                        </div>
                                    </div>
                                    <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center">
                                        <span class="badge ${badgeColor} p-2"><i class="fa-solid fa-cubes me-1"></i>Stock: ${p.stock}</span>
                                        <button class="btn btn-primary"><i class="fa-solid fa-cart-plus me-1"></i>Comprar</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        contenedor.innerHTML += tarjeta;
                    });
                })
                .catch(error => {
                    console.error("Error al cargar la API:", error);
                    document.getElementById("contenedor-productos").innerHTML = `
                        <div class="alert alert-danger w-100 text-center">
                            <i class="fa-solid fa-triangle-exclamation me-2"></i>
                            Error de conexión. Asegurate de que el backend de Spring Boot esté corriendo.
                        </div>`;
                });
        });
    </script>
</body>
</html>
